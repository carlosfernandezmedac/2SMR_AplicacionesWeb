<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de contacto</title>
</head>
<body>
    <h1>Página de contacto</h1>
    <a href="index.html"> Página principal</a> <br><br>
    <img src="img/imagen.jpg" alt="Imagen de Vandelvira" height="300px" width="400px" title="Vandelvira">
    <br><br><br><br><br>
    <form action="datos.php" method="post">
        <fieldset>
            <legend> Formulario datos personales</legend> 
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" value="Carlos"> <br>
            <label>Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Escriba aquí su apellido..."> <br>
            <label>Edad</label>
            <input type="number" id="edad" name="edad"> <br>
            <label>Contraseña</label>
            <input type="password" id="clave" name="clave"> 
            <br><br>
        </fieldset>
        
        <fieldset>
            <legend>Lista despegable</legend> 
            <select name="lista">
                <option value="modulo1"> Sistemas Operativos en Red</option>
                <option value="modulo2"> Aplicaciones Web</option>
                <option value="modulo3"> Fundamentos de programacion</option>
            </select>
        </fieldset> 

        <fieldset>
            <legend>Listado de la compra</legend>
            <input type="checkbox" id="elemento1" name="elemento1" value="leche">
            <label for="elemento1"> Caja de leche</label>   
            <input type="checkbox" id="elemento2" name="elemento2" value="pan" checked="true">
            <label for="elemento2"> Pan </label>
            <input type="checkbox" id="elemento3" name="elemento3" value="huevos">
            <label for="elemento3"> Docena de huevos</label>
        </fieldset>
        <br>
        <label for="comentario"> Comentarios:</label> <br>
        <textarea id="comentario" name="comentario" rows="10" cols="40"></textarea> <br>
        <button type="submit"> Enviar </button>
        <button type="reset"> Borrar</button>
    </form>
</body>
</html>
